<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Rock - Paper - Scissors</h1>
      <div class="choices">
        <button onclick="playGame('rock')">👊</button>
        <button onclick="playGame('paper')">✋</button>
        <button onclick="playGame('scissors')">✌️</button>
      </div>
      <div id="choicesDisplay">
        <p id="playerChoice">Player:</p>
        <p id="computerChoice">Computer:</p>
      </div>
      <p id="resultDisplay">Make your move!</p>
      <div id="scoresDisplay">
        <p>Player Score: <span id="playerScore" class="green">0</span></p>
        <p>Computer Score: <span id="computerScore" class="red">0</span></p>
      </div>
      <button id="resetBtn" onclick="resetGame()">Reset</button>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
